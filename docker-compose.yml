version: '3'

services:
  moguta_db:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: my_secret_pw_shh
      MYSQL_DATABASE: test_db
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass
    volumes:
      - ./data/mysql:/var/lib/mysql
    ports:
      - "9906:3306"
  moguta_web:
    image: moguta_web:last
    platform: linux/amd64
    build: ./
    container_name: php_web
    depends_on:
      - moguta_db
    volumes:
      - ./php/:/var/www/html/
      - ./komtet-kassa/:/var/www/html/mg-plugins/komtet-kassa/
    ports:
      - "8100:80"
    links:
      - moguta_db:mysql
    stdin_open: true
    tty: true

  moguta_phpmyadmin:
    image: phpmyadmin
    platform: linux/amd64
    restart: always
    ports:
      - 8101:80
    environment:
      - PMA_ARBITRARY=1